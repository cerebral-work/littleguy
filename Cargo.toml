[workspace]
resolver = "3"
exclude = ["patches/harvest-camel"]
members = [
    "crates/littleguy",
    "crates/littleguy-channels",
    "crates/littleguy-core",
    "crates/littleguy-models",
    "crates/littleguy-stores",
    "crates/littleguy-tools",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/littleguy"

[workspace.dependencies]
littleguy-channels = { version = "0.1.0", path = "crates/littleguy-channels" }
littleguy-core = { version = "0.1.0", path = "crates/littleguy-core" }
littleguy-models = { version = "0.1.0", path = "crates/littleguy-models" }
littleguy-stores = { version = "0.1.0", path = "crates/littleguy-stores" }
littleguy-tools = { version = "0.1.0", path = "crates/littleguy-tools" }
autumn-harvest = "0.10.0"
autumn-harvest-agent = { version = "0.10.0", features = ["sqlite"] }
autumn-harvest-plugin = { version = "0.10.0", default-features = false, features = ["connectors"] }
autumn-harvest-sqlite = "0.10.0"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
blake3 = "1"
clap = { version = "4.6", features = ["derive", "env"] }
proptest = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# EST-1604: `camel-processor` moved from `zip = "8"` to `zip = "9"` in 0.59.0,
# closing 5 `zip` 8.6.0 Dependabot advisories (including critical
# GHSA-m665-v7pm-7grj, patched in `zip >= 9.0.5`). Published `harvest-camel`
# 0.4.0 (`autumn-foundation/harvest-camel@164a158a`) still pins `camel-* = "0.57"`;
# `patches/harvest-camel` carries unmodified 0.4.0 `src/` with `camel-*` bumped
# to `"0.59"` until upstream publishes `harvest-camel > 0.4.0`.
[patch.crates-io]
harvest-camel = { path = "patches/harvest-camel" }
