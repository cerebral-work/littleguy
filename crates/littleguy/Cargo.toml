[package]
name = "littleguy"
description = "An always-on personal agent on autumn-harvest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lg"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
autumn-harvest = { workspace = true, features = ["sandbox-activities"] }
autumn-harvest-agent = { workspace = true, features = ["sandbox"] }
autumn-harvest-plugin = { workspace = true }
autumn-harvest-sqlite = { workspace = true }
camel-api = "0.57"
chrono = "0.4"
camel-builder = "0.57"
camel-component-api = "0.57"
camel-component-direct = "0.57"
camel-component-file = "0.57"
camel-component-timer = "0.57"
camel-core = "0.57"
harvest-camel = { version = "0.4", default-features = false, features = ["sqlite"] }
clap = { workspace = true }
getrandom = "0.4"
littleguy-channels = { workspace = true }
littleguy-core = { workspace = true }
littleguy-models = { workspace = true }
littleguy-stores = { workspace = true }
littleguy-tools = { workspace = true }
rustix = { workspace = true }
san-mateo = "0.1"
san-mateo-sqlite = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = "0.23"
reqwest = { version = "0.12", default-features = false }
littleguy-channels = { workspace = true, features = ["testing"] }
littleguy-tools = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio-util = "0.7"

[lints]
workspace = true
