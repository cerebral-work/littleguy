# CI for littleguy. Every step calls `cargo xtask`, so a local run and a CI
# run take the same path. Actions are pinned by SHA, as in autumn-harvest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Pushes to main always
# finish, so each main commit gets a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check the format
        run: cargo xtask fmt
      - name: Clippy, pedantic and nursery, warnings denied
        run: cargo xtask clippy
      - name: Check container and workflow supply-chain invariants
        run: cargo xtask container-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run every test
        run: cargo xtask test

  coverage:
    name: Coverage (85% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure line coverage
        run: cargo xtask coverage --fail-under 85

  verus:
    name: Verus proofs
    runs-on: ubuntu-latest
    # The download takes most of the time. The proofs take a few seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify the Verus proofs
        run: cargo xtask verus

  container:
    name: Container smoke (non-root 65532:65532)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build non-root runtime image
        run: docker build -t littleguy:ci .
      - name: Verify non-root user and read-only runtime execution
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.User}}' littleguy:ci)" = "65532:65532"
          test "$(docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /usr/bin/id littleguy:ci -u)" = "65532"
          test "$(docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /usr/bin/id littleguy:ci -g)" = "65532"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges littleguy:ci --version
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges littleguy:ci pool --help >/dev/null
